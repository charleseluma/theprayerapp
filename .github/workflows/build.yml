name: Test build

# Every push to main:
#   1. checks all three apps (listener app, Prayer Warriors, Admin Console),
#   2. applies the database rules and deploys the account service to Supabase,
#   3. publishes the Prayer Warriors web app and the Admin Console,
#   4. starts Android test builds for whichever phone app changed
#      (install links on expo.dev → Projects → Builds).
#
# GitHub → Settings → Secrets and variables → Actions:
#   Secret   EXPO_TOKEN             expo.dev → Account settings → Access tokens
#   Secret   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens
#   Variable SUPABASE_URL           Supabase → Project Settings → Data API → Project URL
#   Variable SUPABASE_ANON_KEY      Supabase → Project Settings → API Keys → anon / publishable key
#   Secret   SMTP_USER              Gmail address that sends sign-up and approval emails (optional)
#   Secret   SMTP_PASSWORD          Google app password for that Gmail address (optional)
#   Without the SMTP secrets, self sign-up stays closed and everything else works.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-build
  cancel-in-progress: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  WARRIORS_URL: https://prayer-uploads-charleseluma.expo.app
  CONSOLE_URL: https://prayer-admin-charleseluma.expo.app

jobs:
  check:
    name: Check the code
    runs-on: ubuntu-latest
    outputs:
      listener: ${{ steps.changes.outputs.listener }}
      warriors: ${{ steps.changes.outputs.warriors }}
    steps:
      - name: Report which settings GitHub can see
        run: |
          for name in EXPO_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -n "${!name}" ]; then echo "::notice::$name is set"; else echo "::error::$name is missing. Add it under Settings → Secrets and variables → Actions."; missing=1; fi
          done
          [ -z "$missing" ]
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then echo "::warning::SMTP_USER / SMTP_PASSWORD not set: self sign-up stays closed and no emails are sent."; else echo "::notice::Email sending is set up"; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which phone apps changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "listener=true" >> "$GITHUB_OUTPUT"; echo "warriors=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "$files"
          echo "$files" | grep -qvE '^(warriors|console|supabase|\.github)/|\.md$' && echo "listener=true" >> "$GITHUB_OUTPUT" || echo "listener=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^warriors/' && echo "warriors=true" >> "$GITHUB_OUTPUT" || echo "warriors=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            warriors/package-lock.json
            console/package-lock.json
      - name: Listener app — install and typecheck
        run: npm ci && npx tsc --noEmit
      - name: Listener app — web bundle builds
        run: npx expo export --platform web --output-dir dist
      - name: Prayer Warriors — install and typecheck
        working-directory: warriors
        run: npm ci && npx tsc --noEmit
      - name: Admin Console — install and typecheck
        working-directory: console
        run: npm ci && npx tsc --noEmit

  backend:
    name: Update database and account service
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the Supabase project
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#')
          if ! echo "$ref" | grep -qE '^[a-z0-9]{10,}$'; then echo "::error::SUPABASE_URL doesn't look like https://<project>.supabase.co"; exit 1; fi
          echo "REF=$ref" >> "$GITHUB_ENV"
      - name: Apply database rules (supabase/schema.sql)
        run: |
          jq -n --rawfile q supabase/schema.sql '{query: $q}' > query.json
          curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @query.json > /dev/null
          echo "Database rules applied."
      - name: Sign-in and email settings
        run: |
          allow="$WARRIORS_URL/**,$CONSOLE_URL/**,prayerwarriors://**"
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            # Self sign-up with email confirmation, sent through the Gmail account.
            jq -n --arg site "$WARRIORS_URL" --arg allow "$allow" --arg user "$SMTP_USER" --arg pass "$SMTP_PASSWORD" \
              --rawfile confirm supabase/templates/confirmation.html --rawfile recovery supabase/templates/recovery.html \
              '{site_url: $site, uri_allow_list: $allow, mailer_otp_exp: 86400, password_min_length: 8,
                disable_signup: false, external_email_enabled: true, mailer_autoconfirm: false,
                smtp_host: "smtp.gmail.com", smtp_port: "465", smtp_user: $user, smtp_pass: ($pass | gsub(" "; "")),
                smtp_admin_email: $user, smtp_sender_name: "The Prayer App", rate_limit_email_sent: 100,
                mailer_subjects_confirmation: "Confirm your Prayer Warriors account",
                mailer_templates_confirmation_content: $confirm,
                mailer_subjects_recovery: "Reset your Prayer Warriors password",
                mailer_templates_recovery_content: $recovery}' > auth.json
            # The account service uses the same account for approval emails.
            jq -n --arg user "$SMTP_USER" --arg pass "$SMTP_PASSWORD" \
              '{query: ("insert into public.app_settings (key, value) values (\u0027smtp_user\u0027, \u0027" + ($user | gsub("\u0027"; "\u0027\u0027")) + "\u0027), (\u0027smtp_password\u0027, \u0027" + ($pass | gsub(" "; "") | gsub("\u0027"; "\u0027\u0027")) + "\u0027) on conflict (key) do update set value = excluded.value")}' > smtp.json
            curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @smtp.json > /dev/null
            echo "Self sign-up is open; emails are sent from $SMTP_USER."
          else
            jq -n --arg site "$WARRIORS_URL" --arg allow "$allow" \
              '{site_url: $site, uri_allow_list: $allow, mailer_otp_exp: 86400, password_min_length: 8, disable_signup: true}' > auth.json
            echo "Self sign-up stays closed until SMTP_USER and SMTP_PASSWORD are added."
          fi
          curl -sS --fail-with-body -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @auth.json > /dev/null
          echo "Sign-in settings updated."
      - name: Deploy the account service
        run: npx --yes supabase@latest functions deploy team-admin --project-ref "$REF" --use-api --no-verify-jwt

  warriors-web:
    name: Publish Prayer Warriors (web)
    needs: [check, backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warriors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: warriors/package-lock.json
      - run: npm ci
      - name: Build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WARRIORS_URL: ${{ env.WARRIORS_URL }}
        run: npx expo export --platform web --output-dir dist
      - run: npx eas-cli@latest init --non-interactive --force
      - run: npx eas-cli@latest deploy --prod --non-interactive --dev-domain prayer-uploads-charleseluma

  console-web:
    name: Publish Admin Console
    needs: [check, backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - name: Build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WARRIORS_URL: ${{ env.WARRIORS_URL }}
        run: npx expo export --platform web --output-dir dist
      - run: npx eas-cli@latest init --non-interactive --force
      - run: npx eas-cli@latest deploy --prod --non-interactive --dev-domain prayer-admin-charleseluma

  warriors-android:
    name: Prayer Warriors Android test build
    needs: [check, backend]
    if: needs.check.outputs.warriors == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warriors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: warriors/package-lock.json
      - run: npm ci
      - name: Point the app at the prayer service
        run: printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\nEXPO_PUBLIC_WARRIORS_URL=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$WARRIORS_URL" > .env
      - run: npx eas-cli@latest init --non-interactive --force
      - run: npx eas-cli@latest build --profile preview --platform android --non-interactive --no-wait

  listener-android:
    name: Listener app Android test build
    needs: check
    if: needs.check.outputs.listener == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Point the app at the prayer service
        run: printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
      - run: npx eas-cli@latest init --non-interactive --force
      - run: npx eas-cli@latest build --profile preview --platform android --non-interactive --no-wait
